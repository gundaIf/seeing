<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>～への入り口 ✴︎ Deen David</title>
<meta name="description" content="Shot with a mix of analog and digital cameras.">
<meta property="og:site_name" content="～への入り口 ✴︎ Deen David">
<meta property="og:title" content="Images">
<meta property="og:url" content="https://seeing.deeeen.xyz">
<link rel="icon" href="https://cdn.blot.im/blog_e9e46454a86f4b50aded8710a3e59817/_avatars/c5a1db36-3051-4d3e-b5da-bb6bf31b219d.jpg" type="image/x-icon">
<link rel="apple-touch-icon" href="https://cdn.blot.im/blog_e9e46454a86f4b50aded8710a3e59817/_avatars/c5a1db36-3051-4d3e-b5da-bb6bf31b219d.jpg">
<script>
(function () {
  var root = document.documentElement;
  try {
    var t = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', t || (prefersDark ? 'dark' : 'light'));
  } catch (e) { root.setAttribute('data-theme', 'light'); }
  root.setAttribute('data-season', 'monsoon');
})();
</script>
<style>
  :root{
    --text:#000000;
    --text-rgb:0,0,0;
    --bg:#ffffff;
    --accent:#0000FF;
  }
  [data-theme=dark]{
    --text:#e8e8e8;
    --text-rgb:232,232,232;
    --bg:#111111;
    --accent:#0000FF;
    color-scheme:dark;
  }
  [data-season=monsoon]{
    --text:#2b322f;
    --text-rgb:43,50,47;
    --bg:#d8dcd9;
    --accent:#3f6f63;
    color-scheme:light;
  }
  [data-season=monsoon][data-theme=dark]{
    --text:#c4ccc8;
    --text-rgb:196,204,200;
    --bg:#14181a;
    --accent:#6fae9c;
    color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  html{
    font-family:Helvetica,Helvetica Neue,Arial,sans-serif;
    font-size:15px;
    line-height:1.7;
    text-rendering:optimizeLegibility;
  }
  body{
    margin:0;
    padding:2em;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    transition:background-color .2s ease,color .2s ease;
  }
  a{ color:inherit; text-decoration:none; }
  a:hover, a:focus{ color:var(--accent); }

  .site-header{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    gap:1em;
    margin-bottom:2em;
    padding-bottom:1em;
  }
  .site-title{
    font-size:calc(15px * .6667);
    font-weight:400;
    margin:0;
  }
  .site-nav ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:0;
  }
  .site-nav li{ display:flex; align-items:center; }
  .site-nav a{
    font-size:calc(15px * .6667);
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  .site-nav-spacer{
    display:inline;
    margin:0 6px;
    font-size:calc(15px * .6667);
  }
  .theme-toggle{
    background:0 0;
    border:none;
    cursor:pointer;
    padding:0;
    display:inline-flex;
    align-items:center;
    line-height:1;
    font-size:calc(15px * .6667);
  }
  .theme-toggle-track{
    position:relative;
    display:inline-block;
    width:1.75em;
    height:.875em;
    border:1px solid rgba(var(--text-rgb),.35);
    border-radius:999px;
    background:0 0;
    box-sizing:border-box;
    transition:background-color .2s ease,border-color .2s ease;
  }
  .theme-toggle-thumb{
    position:absolute;
    top:50%;
    left:.125em;
    width:.5em;
    height:.5em;
    border-radius:50%;
    background:rgba(var(--text-rgb),.5);
    transform:translateY(-50%);
    transition:left .2s ease,background-color .2s ease;
  }
  [data-theme=dark] .theme-toggle-track{
    background:rgba(var(--text-rgb),.15);
    border-color:rgba(var(--text-rgb),.5);
  }
  [data-theme=dark] .theme-toggle-thumb{
    left:calc(100% - .5em - .125em);
    background:rgba(var(--text-rgb),.9);
  }
  .theme-toggle:hover .theme-toggle-thumb{ background:var(--accent); }

  .intro{ max-width:36em; margin:3em auto 2.5em; }
  .weather{
    display:inline-flex;
    align-items:baseline;
    gap:.5em;
    font-size:calc(15px * .6667);
    text-transform:uppercase;
    letter-spacing:.12em;
    color:rgba(var(--text-rgb),.5);
    margin:0 0 .6em 0;
  }
  .intro p{
    margin:0;
    font-size:15px;
    color:rgba(var(--text-rgb),.72);
  }
  .count{
    margin:.7em 0 0;
    font-size:calc(15px * .6667);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(var(--text-rgb),.5);
  }

  .wall{
    column-count:3;
    column-gap:12px;
    margin:0 0 4em;
  }
  .cell{
    break-inside:avoid;
    margin:0 0 12px;
    display:block;
    width:100%;
    padding:0;
    border:0;
    background:rgba(var(--text-rgb),.06);
    color:inherit;
    cursor:zoom-in;
    font:inherit;
  }
  .cell img{
    display:block;
    width:100%;
    height:auto;
    opacity:0;
    transition:opacity .45s ease;
  }
  .cell img.on{ opacity:1; }

  .status{
    text-align:center;
    font-size:calc(15px * .6667);
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(var(--text-rgb),.5);
    min-height:1.4em;
    margin:0 0 2em;
  }

  footer{
    display:flex;
    justify-content:space-between;
    gap:1em;
    flex-wrap:wrap;
    font-size:calc(15px * .6667);
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(var(--text-rgb),.5);
    padding-top:1em;
  }

  .lb{
    position:fixed; inset:0;
    background:rgba(0,0,0,.86);
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    padding:2em;
  }
  .lb.on{ display:flex; }
  .lb img{ max-width:min(92vw,1400px); max-height:86vh; object-fit:contain; }
  .lb-meta{
    position:absolute; left:2em; bottom:1.4em;
    color:#e8e8e8;
    font-size:calc(15px * .6667);
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .lb-meta a{ border-bottom:1px solid rgba(232,232,232,.35); }
  .lb-x,.lb-prev,.lb-next{
    position:absolute;
    background:none; border:0;
    color:#e8e8e8;
    cursor:pointer;
    font-family:Helvetica,Helvetica Neue,Arial,sans-serif;
    font-size:28px;
    line-height:1;
    padding:8px;
  }
  .lb-x{ top:1em; right:1.2em; }
  .lb-prev{ left:.4em; top:50%; transform:translateY(-50%); }
  .lb-next{ right:.4em; top:50%; transform:translateY(-50%); }

  @media (max-width:980px){ .wall{ column-count:2; } }
  @media (max-width:640px){
    body{ padding:1.25em; }
    .site-header{ flex-wrap:wrap; }
    .wall{ column-count:1; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="https://deeeen.xyz/">～への入り口 ✴︎ Deen David</a></h1>
    <nav class="site-nav" aria-label="Main menu">
      <ul>
        <li>
          <a href="https://deeeen.xyz/" title="Notes">Notes</a><span class="site-nav-spacer" aria-hidden="true">&nbsp;&nbsp;◊&nbsp;&nbsp;</span>
        </li>
        <li>
          <a href="/" title="Images">Images</a><span class="site-nav-spacer" aria-hidden="true">&nbsp;&nbsp;◊&nbsp;&nbsp;</span>
        </li>
        <li>
          <a href="https://www.are.na/deen" title="Research">Research</a><span class="site-nav-spacer" aria-hidden="true">&nbsp;&nbsp;◊&nbsp;&nbsp;</span>
        </li>
        <li>
          <a href="https://deeeen.xyz/about" title="About">About</a>
        </li>
        <li>
          <span class="site-nav-spacer" aria-hidden="true">&nbsp;&nbsp;◊&nbsp;&nbsp;</span>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="theme-toggle-track">
              <span class="theme-toggle-thumb"></span>
            </span>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <section class="intro">
    <p class="weather"><span class="glyph">✴︎</span> images</p>
    <p>Shot with a mix of analog and digital cameras.</p>
    <p class="count" id="count">Looking…</p>
  </section>

  <div class="wall" id="wall"></div>
  <p class="status" id="status"></p>

  <footer>
    <span>From the Are.na channel Images</span>
    <a href="https://www.are.na/deen/images-vl2czognwuq" target="_blank" rel="noopener">are.na/deen/images</a>
  </footer>

  <div class="lb" id="lb" hidden>
    <button class="lb-x" id="lbx" aria-label="Close">×</button>
    <button class="lb-prev" id="lbp" aria-label="Previous">‹</button>
    <img id="lbi" alt="">
    <button class="lb-next" id="lbn" aria-label="Next">›</button>
    <div class="lb-meta" id="lbm"></div>
  </div>

<script>
"use strict";

(function () {
  var btn = document.getElementById("theme-toggle");
  if (!btn) return;
  btn.addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    var next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });
})();

const SLUG = "images-vl2czognwuq";
const PER = 24;
const FILEISH = /^(R\d+|DSC|IMG[_-]?|P\d+|DSCN|LUC|_MG_)/i;

const wall = document.getElementById("wall");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const lb = document.getElementById("lb");
const lbi = document.getElementById("lbi");
const lbm = document.getElementById("lbm");

const items = [];
let page = 1;
let total = null;
let loading = false;
let done = false;
let openAt = -1;

function prettyTitle(t){
  if (!t) return "";
  if (FILEISH.test(t) || /\.(jpe?g|png|gif|webp|heic)$/i.test(t)) return "";
  return t.trim();
}

function srcOf(block, size){
  const img = block.image || {};
  if (size === "large") return (img.large && img.large.src) || img.src || "";
  return (img.medium && img.medium.src) || (img.small && img.small.src) || img.src || "";
}

function addBlock(block){
  if (block.type !== "Image" || !block.image) return;
  const i = items.length;
  const thumb = srcOf(block, "medium");
  const large = srcOf(block, "large");
  const w = block.image.width || 3;
  const h = block.image.height || 4;
  const title = prettyTitle(block.title);
  items.push({ id: block.id, thumb, large, title, w, h });

  const a = document.createElement("button");
  a.className = "cell";
  a.type = "button";
  a.style.aspectRatio = w + " / " + h;
  a.setAttribute("aria-label", title || "Photograph");
  const img = document.createElement("img");
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = title || "";
  img.src = thumb;
  img.addEventListener("load", () => img.classList.add("on"));
  a.appendChild(img);
  a.addEventListener("click", () => open(i));
  wall.appendChild(a);
}

async function load(){
  if (loading || done) return;
  loading = true;
  statusEl.textContent = page === 1 ? "Gathering photographs…" : "More…";
  try {
    const url = "https://api.are.na/v3/channels/" + SLUG + "/contents?page=" + page + "&per=" + PER;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Are.na " + res.status);
    const json = await res.json();
    const meta = json.meta || {};
    const rows = json.data || [];
    total = meta.total_count || total;
    rows.forEach(addBlock);
    const shown = items.length;
    countEl.textContent = total ? shown + " of " + total : shown + " photographs";
    if (!meta.has_more_pages || rows.length === 0) {
      done = true;
      statusEl.textContent = "";
    } else {
      page += 1;
      statusEl.textContent = "";
    }
  } catch (err) {
    statusEl.textContent = "Could not reach Are.na. Try again in a moment.";
    console.error(err);
  } finally {
    loading = false;
  }
}

function nearBottom(){
  return window.innerHeight + window.scrollY >= document.body.offsetHeight - 900;
}
window.addEventListener("scroll", () => { if (nearBottom()) load(); }, { passive: true });

function open(i){
  if (i < 0 || i >= items.length) return;
  openAt = i;
  const it = items[i];
  lbi.src = it.large || it.thumb;
  lbi.alt = it.title || "";
  lbm.innerHTML = (it.title ? it.title + " · " : "") +
    "<a href=\"https://www.are.na/block/" + it.id + "\" target=\"_blank\" rel=\"noopener\">on are.na</a>";
  lb.hidden = false;
  lb.classList.add("on");
  document.body.style.overflow = "hidden";
}
function close(){
  lb.classList.remove("on");
  lb.hidden = true;
  lbi.src = "";
  document.body.style.overflow = "";
  openAt = -1;
}
document.getElementById("lbx").addEventListener("click", close);
document.getElementById("lbp").addEventListener("click", () => open(openAt - 1));
document.getElementById("lbn").addEventListener("click", () => {
  if (openAt === items.length - 1) load();
  open(openAt + 1);
});
lb.addEventListener("click", (e) => { if (e.target === lb) close(); });
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") open(openAt - 1);
  if (e.key === "ArrowRight") {
    if (openAt === items.length - 1) load();
    open(openAt + 1);
  }
});

load();
</script>
</body>
</html>
