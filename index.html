<!DOCTYPE html>
<meta charset="utf-8">
<title>Seeing</title>
<script>
fetch("https://raw.githubusercontent.com/gundaIf/seeing/8b4d7ea369a751b663dab144f7959d024bd326b9/index.html")
.then(function(r){return r.text()})
.then(function(html){
  html = html.replace(
    "function prettyTitle(t){if(!t)return\"\";",
    "const GUIDISH=/^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$/i;function prettyTitle(t){if(!t)return\"\";if(GUIDISH.test(String(t).replace(/\\.(jpe?g|png|gif|webp|heic)$/i,\"\").trim()))return\"\";"
  );
  document.open();
  document.write(html);
  document.close();
});
</script>
