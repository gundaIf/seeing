<!DOCTYPE html>
<meta charset="utf-8">
<title>Seeing</title>
<script>
fetch("https://raw.githubusercontent.com/gundaIf/seeing/8b4d7ea369a751b663dab144f7959d024bd326b9/index.html")
.then(function(r){return r.text()})
.then(function(html){
  html = html.replace(
    "function prettyTitle(t){if(!t)return\"\";",
    "const GUIDISH=/^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$/i;function prettyTitle(t){if(!t)return\"\";if(GUIDISH.test(String(t).replace(/\\.(jpe?g|png|gif|webp|heic)$/i,\"\").trim()))return\"\";"
  );
  html = html.replace(
    '<link rel="icon" href="https://cdn.blot.im/blog_e9e46454a86f4b50aded8710a3e59817/_avatars/c5a1db36-3051-4d3e-b5da-bb6bf31b219d.jpg" type="image/x-icon">',
    '<link rel="icon" href="/favicon.ico" sizes="any">\n<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n<link rel="apple-touch-icon" href="/apple-touch-icon.png">'
  );
  document.open();
  document.write(html);
  document.close();
});
</script>
