<script>
(function () {
  var root = document.documentElement;
  try {
    var t = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', t || (prefersDark ? 'dark' : 'light'));
  } catch (e) { root.setAttribute('data-theme', 'light'); }
})();

<style>
:root{--text:#2a2722;--text-rgb:42,39,34;--bg:#f5f1e9;--accent:#b0673a;--paper:#efe9dc;--header-size:calc(15px * .6667);--gap:8px;--row-h:232px;color-scheme:light}
[data-theme=dark]{--text:#d9d4ca;--text-rgb:217,212,202;--bg:#15161b;--accent:#d89a5c;--paper:#1c1d22;color-scheme:dark}
*{box-sizing:border-box}
html{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.6;scroll-behavior:smooth}
body{margin:0;color:var(--text);background:var(--bg);min-height:100vh}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:22px 28px 0}
.site-title{margin:0;font-size:var(--header-size);font-weight:400;letter-spacing:.1em;text-transform:uppercase;line-height:1.7}

.home-btn:hover{color:var(--accent)}
.theme-toggle{background:none;border:0;padding:0;cursor:pointer;color:inherit}
.theme-toggle-track{position:relative;display:inline-block;width:1.75em;height:.875em;border:1px solid rgba(var(--text-rgb),.35);border-radius:999px}
.theme-toggle-thumb{position:absolute;top:50%;left:.125em;width:.5em;height:.5em;border-radius:50%;background:rgba(var(--text-rgb),.5);transform:translateY(-50%);transition:left .2s ease}
[data-theme=dark] .theme-toggle-thumb{left:calc(100% - .5em - .125em);background:rgba(var(--text-rgb),.9)}
.theme-toggle:hover .theme-toggle-thumb{background:var(--accent)}
.intro{text-align:center;margin:3.2em auto 1.8em;padding:0 24px}
.intro h2{margin:0 0 .3em;font-size:18px;font-weight:400}
.intro p{margin:0;font-size:13px;color:rgba(var(--text-rgb),.55)}
.gear{width:min(1180px,calc(100% - 48px));margin:0 auto 3.2em}
.gear-head{margin:0 0 1em}
.gear-head h3,.photos-head h3{margin:0;font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:rgba(var(--text-rgb),.5)}

.kit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.body{display:flex;flex-direction:column;min-height:188px;padding:14px 12px 12px;background:var(--paper);border:1px solid rgba(var(--text-rgb),.08)}
.body svg{display:block;width:100%;height:92px;margin:0 0 10px;stroke:currentColor;fill:none;stroke-linejoin:round;stroke-linecap:round}
.body svg path{fill:none}
.body svg .ink{stroke-width:1.35}
.body svg .soft{stroke-width:.7;opacity:.5}
.body .name{margin:auto 0 2px;font-size:12px;white-space:nowrap}
.body .meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--text-rgb),.45);white-space:nowrap}
.body:hover svg{color:var(--accent)}
.count{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--text-rgb),.4)}
.wall{width:min(1180px,calc(100% - 48px));margin:0 auto 1.2em}
.row{display:flex;gap:var(--gap);margin:0 0 var(--gap)}
.cell{display:block;padding:0;border:0;background:rgba(var(--text-rgb),.04);cursor:zoom-in;overflow:hidden;flex:0 0 auto;height:var(--row-h)}
.cell img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}
.cell img.on{opacity:1}
.status{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--text-rgb),.45);min-height:1.4em;margin:0 0 2em}
footer{width:min(1180px,calc(100% - 48px));margin:0 auto;padding:0 0 36px;display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--text-rgb),.4)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;align-items:center;justify-content:center;padding:2em}
.lb.on{display:flex}

.lb-meta{position:absolute;left:2em;bottom:1.4em;color:#f2f2f2;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lb-x,.lb-prev,.lb-next{position:absolute;background:none;border:0;color:#f2f2f2;cursor:pointer;font-size:28px;padding:8px}
.lb-x{top:1em;right:1.2em}.lb-prev{left:.4em;top:50%;transform:translateY(-50%)}.lb-next{right:.4em;top:50%;transform:translateY(-50%)}
@media (max-width:1080px){.kit{grid-template-columns:repeat(3,minmax(0,1fr))}:root{--row-h:200px}}
@media (max-width:720px){.site-header{padding:18px 16px 0}.gear,.wall,footer,.photos-head{width:calc(100% - 24px)}.kit{grid-template-columns:repeat(2,minmax(0,1fr))}:root{--row-h:168px;--gap:6px}}
</style>

<script>
"use strict";
(function(){var btn=document.getElementById("theme-toggle");if(!btn)return;btn.addEventListener("click",function(){var current=document.documentElement.getAttribute("data-theme");var next=current==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("theme",next)}catch(e){}})})();
const SLUG="images-vl2czognwuq";const PER=30;const FILEISH=/^(R\d+|DSC|IMG[_-]?|P\d+|DSCN|LUC|_MG_)/i;
const wall=document.getElementById("wall");const statusEl=document.getElementById("status");const countEl=document.getElementById("count");
const lb=document.getElementById("lb");const lbi=document.getElementById("lbi");const lbm=document.getElementById("lbm");
const items=[];let page=1,total=null,loading=false,done=false,openAt=-1;
function prettyTitle(t){if(!t)return"";if(FILEISH.test(t)||/\.(jpe?g|png|gif|webp|heic)$/i.test(t))return"";return t.trim()}
function srcOf(block,size){const img=block.image||{};if(size==="large")return(img.large&&img.large.src)||img.src||"";return(img.medium&&img.medium.src)||(img.small&&img.small.src)||img.src||""}
function rowHeight(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h"))||220}
function makeCell(entry){const a=document.createElement("button");a.className="cell";a.type="button";a.setAttribute("aria-label",entry.title||"Photograph");const img=document.createElement("img");img.loading="lazy";img.decoding="async";img.alt=entry.title||"";img.src=entry.thumb;img.addEventListener("load",()=>img.classList.add("on"));a.appendChild(img);a.addEventListener("click",()=>open(entry.i));entry.el=a;return a}
function relayout(){const H=rowHeight();const gap=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap"))||8;const W=wall.clientWidth;wall.innerHTML="";let row=[];let used=0;function flush(fill){if(!row.length)return;const rowEl=document.createElement("div");rowEl.className="row";const extra=fill?Math.max(0,W-used):0;const add=extra/row.length;row.forEach(entry=>{const w=(entry.w/entry.h)*H+add;entry.el.style.width=w+"px";entry.el.style.height=H+"px";rowEl.appendChild(entry.el)});wall.appendChild(rowEl);row=[];used=0}items.forEach(entry=>{if(!entry.el)makeCell(entry);const w=(entry.w/entry.h)*H;if(row.length&&used+w+gap>W)flush(true);if(row.length)used+=gap;row.push(entry);used+=w});flush(false)}
function addBlock(block){if(block.type!=="Image"||!block.image)return;const i=items.length;const w=block.image.width||3,h=block.image.height||2;const portrait=(w/h)<0.95;const entry={i,id:block.id,thumb:srcOf(block,portrait?"medium":"large"),large:srcOf(block,"large"),title:prettyTitle(block.title),w,h,portrait};items.push(entry);makeCell(entry)}
async function load(){if(loading||done)return;loading=true;statusEl.textContent=page===1?"Gathering photographs…":"More…";try{const res=await fetch("https://api.are.na/v3/channels/"+SLUG+"/contents?page="+page+"&per="+PER);if(!res.ok)throw new Error("Are.na "+res.status);const json=await res.json();const meta=json.meta||{};(json.data||[]).forEach(addBlock);relayout();total=meta.total_count||total;countEl.textContent=total?items.length+" of "+total:items.length+" photographs";if(!meta.has_more_pages||!(json.data||[]).length){done=true;statusEl.textContent=""}else{page+=1;statusEl.textContent=""}}catch(err){statusEl.textContent="Could not reach Are.na. Try again in a moment.";console.error(err)}finally{loading=false}}
window.addEventListener("scroll",()=>{if(window.innerHeight+window.scrollY>=document.body.offsetHeight-900)load()},{passive:true});
let resizeTick=0;window.addEventListener("resize",()=>{clearTimeout(resizeTick);resizeTick=setTimeout(relayout,80)});
function open(i){if(i<0||i>=items.length)return;openAt=i;const it=items[i];lbi.src=it.large||it.thumb;lbi.alt=it.title||"";lbm.innerHTML=(it.title?it.title+" · ":"")+"<a href=\"https://www.are.na/block/"+it.id+"\" target=\"_blank\" rel=\"noopener\">on are.na</a>";lb.hidden=false;lb.classList.add("on");document.body.style.overflow="hidden"}
function close(){lb.classList.remove("on");lb.hidden=true;lbi.src="";document.body.style.overflow="";openAt=-1}
document.getElementById("lbx").addEventListener("click",close);
document.getElementById("lbp").addEventListener("click",()=>open(openAt-1));
document.getElementById("lbn").addEventListener("click",()=>{if(openAt===items.length-1)load();open(openAt+1)});
lb.addEventListener("click",e=>{if(e.target===lb)close()});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")open(openAt-1);if(e.key==="ArrowRight"){if(openAt===items.length-1)load();open(openAt+1)}});
load();
</script>
