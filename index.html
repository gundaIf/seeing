<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeing — Deen David</title>
<meta name="description" content="Photographs. Shot with a mix of analog and digital cameras.">
<meta property="og:title" content="Seeing — Deen David">
<meta property="og:description" content="Photographs. Shot with a mix of analog and digital cameras.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://seeing.deeeen.xyz">
<meta name="theme-color" content="#F3EFE4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE4;
    --paper-deep:#ECE5D5;
    --ink:#26221A;
    --ink-soft:#7A7263;
    --hair:#D9D0BD;
    --serif:"EB Garamond","Iowan Old Style",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  html[data-theme="dark"]{
    --paper:#161410;
    --paper-deep:#1E1B16;
    --ink:#EDE6D6;
    --ink-soft:#9A917F;
    --hair:#3A342A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }
  a:hover{ opacity:.65; }

  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    padding:22px 28px 18px; position:sticky; top:0; z-index:8;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(10px);
  }
  .brand{
    font-size:13px; letter-spacing:.04em; text-transform:uppercase;
    font-family:var(--mono); display:flex; align-items:center; gap:10px;
  }
  .brand em{ font-family:var(--serif); font-style:italic; text-transform:none; letter-spacing:0; font-size:18px; }
  .nav{ display:flex; align-items:center; gap:14px; font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft); }
  .nav .here{ color:var(--ink); }
  .diamond{ opacity:.45; }
  .theme{
    background:none; border:0; color:var(--ink-soft); cursor:pointer; font-size:14px; padding:0;
  }

  .intro{ max-width:640px; margin:28px auto 42px; padding:0 28px; }
  .intro h1{ font-size:42px; font-weight:500; letter-spacing:-.02em; margin:0 0 8px; }
  .intro h1 em{ font-style:italic; font-weight:400; }
  .intro p{ margin:0; color:var(--ink-soft); font-size:18px; }
  .count{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin-top:14px; }

  .wall{
    column-count:3; column-gap:14px; padding:0 18px 80px;
  }
  .cell{
    break-inside:avoid; margin:0 0 14px; display:block; width:100%;
    position:relative; background:var(--paper-deep); cursor:zoom-in;
    border:0; padding:0; font:inherit; color:inherit;
  }
  .cell img{
    display:block; width:100%; height:auto; vertical-align:middle;
    opacity:0; transition:opacity .7s var(--ease);
  }
  .cell img.on{ opacity:1; }

  .status{
    text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft); padding:0 20px 60px; min-height:1.4em;
  }

  .lb{
    position:fixed; inset:0; background:rgba(22,20,16,.88); z-index:20;
    display:none; align-items:center; justify-content:center; padding:28px;
  }
  .lb.on{ display:flex; }
  .lb img{ max-width:min(92vw,1400px); max-height:86vh; object-fit:contain; box-shadow:0 30px 80px -40px #000; }
  .lb-meta{
    position:absolute; left:28px; bottom:22px; color:#EDE6D6;
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  }
  .lb-meta a{ border-bottom:1px solid rgba(237,230,214,.35); }
  .lb-x, .lb-prev, .lb-next{
    position:absolute; background:none; border:0; color:#EDE6D6; cursor:pointer;
    font-family:var(--serif); font-size:28px; line-height:1; padding:8px;
  }
  .lb-x{ top:16px; right:22px; }
  .lb-prev{ left:10px; top:50%; transform:translateY(-50%); }
  .lb-next{ right:10px; top:50%; transform:translateY(-50%); }

  footer{
    padding:10px 28px 36px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft);
  }

  @media (max-width:980px){ .wall{ column-count:2; } .intro h1{ font-size:34px; } }
  @media (max-width:620px){
    .bar{ padding:16px 16px 12px; }
    .nav a:not(.here){ display:none; }
    .wall{ column-count:1; padding:0 12px 56px; }
    .intro{ margin-top:12px; }
  }
  @media (prefers-reduced-motion:reduce){
    .cell img{ transition:none; opacity:1; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="https://deeeen.xyz">～への入り口 <em>Seeing</em></a>
    <nav class="nav">
      <a href="https://deeeen.xyz">Notes</a>
      <span class="diamond">♦</span>
      <a class="here" href="/">Images</a>
      <span class="diamond">♦</span>
      <a href="https://deeeen.xyz/research">Research</a>
      <span class="diamond">♦</span>
      <a href="https://deeeen.xyz/about">About</a>
      <span class="diamond">♦</span>
      <button class="theme" id="theme" aria-label="Toggle theme">◐</button>
    </nav>
  </header>

  <section class="intro">
    <h1><em>Seeing</em></h1>
    <p>Shot with a mix of analog and digital cameras.</p>
    <p class="count" id="count">Looking…</p>
  </section>

  <div class="wall" id="wall"></div>
  <p class="status" id="status"></p>

  <footer>
    <span>From the Are.na channel Images</span>
    <a href="https://www.are.na/deen/images-vl2czognwuq" target="_blank" rel="noopener">are.na/deen/images</a>
  </footer>

  <div class="lb" id="lb" hidden>
    <button class="lb-x" id="lbx" aria-label="Close">×</button>
    <button class="lb-prev" id="lbp" aria-label="Previous">‹</button>
    <img id="lbi" alt="">
    <button class="lb-next" id="lbn" aria-label="Next">›</button>
    <div class="lb-meta" id="lbm"></div>
  </div>

<script>
"use strict";

const SLUG = "images-vl2czognwuq";
const PER = 24;
const FILEISH = /^(R\d+|DSC|IMG[_-]?|P\d+|DSCN|LUC|_MG_)/i;

const wall = document.getElementById("wall");
const statusEl = document.getElementById("status");
const countEl = document.getElementById("count");
const lb = document.getElementById("lb");
const lbi = document.getElementById("lbi");
const lbm = document.getElementById("lbm");

const items = [];
let page = 1;
let total = null;
let loading = false;
let done = false;
let openAt = -1;

const themeBtn = document.getElementById("theme");
const savedTheme = localStorage.getItem("seeing-theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("seeing-theme", next);
});

function prettyTitle(t){
  if (!t) return "";
  if (FILEISH.test(t) || /\.(jpe?g|png|gif|webp|heic)$/i.test(t)) return "";
  return t.trim();
}

function srcOf(block, size){
  const img = block.image || {};
  if (size === "large") return (img.large && img.large.src) || img.src || "";
  return (img.medium && img.medium.src) || (img.small && img.small.src) || img.src || "";
}

function addBlock(block){
  if (block.type !== "Image" || !block.image) return;
  const i = items.length;
  const thumb = srcOf(block, "medium");
  const large = srcOf(block, "large");
  const w = block.image.width || 3;
  const h = block.image.height || 4;
  const title = prettyTitle(block.title);
  items.push({ id: block.id, thumb, large, title, w, h });

  const a = document.createElement("button");
  a.className = "cell";
  a.type = "button";
  a.style.aspectRatio = w + " / " + h;
  a.setAttribute("aria-label", title || "Photograph");
  const img = document.createElement("img");
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = title || "";
  img.src = thumb;
  img.addEventListener("load", () => img.classList.add("on"));
  a.appendChild(img);
  a.addEventListener("click", () => open(i));
  wall.appendChild(a);
}

async function load(){
  if (loading || done) return;
  loading = true;
  statusEl.textContent = page === 1 ? "Gathering photographs…" : "More…";
  try {
    const url = "https://api.are.na/v3/channels/" + SLUG + "/contents?page=" + page + "&per=" + PER;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Are.na " + res.status);
    const json = await res.json();
    const meta = json.meta || {};
    const rows = json.data || [];
    total = meta.total_count || total;
    rows.forEach(addBlock);
    const shown = items.length;
    countEl.textContent = total ? shown + " of " + total : shown + " photographs";
    if (!meta.has_more_pages || rows.length === 0) {
      done = true;
      statusEl.textContent = "";
    } else {
      page += 1;
      statusEl.textContent = "";
    }
  } catch (err) {
    statusEl.textContent = "Could not reach Are.na. Try again in a moment.";
    console.error(err);
  } finally {
    loading = false;
  }
}

function nearBottom(){
  return window.innerHeight + window.scrollY >= document.body.offsetHeight - 900;
}
window.addEventListener("scroll", () => { if (nearBottom()) load(); }, { passive: true });

function open(i){
  if (i < 0 || i >= items.length) return;
  openAt = i;
  const it = items[i];
  lbi.src = it.large || it.thumb;
  lbi.alt = it.title || "";
  lbm.innerHTML = (it.title ? it.title + " · " : "") +
    "<a href=\"https://www.are.na/block/" + it.id + "\" target=\"_blank\" rel=\"noopener\">on are.na</a>";
  lb.hidden = false;
  lb.classList.add("on");
  document.body.style.overflow = "hidden";
}
function close(){
  lb.classList.remove("on");
  lb.hidden = true;
  lbi.src = "";
  document.body.style.overflow = "";
  openAt = -1;
}
document.getElementById("lbx").addEventListener("click", close);
document.getElementById("lbp").addEventListener("click", () => open(openAt - 1));
document.getElementById("lbn").addEventListener("click", () => {
  if (openAt === items.length - 1) load();
  open(openAt + 1);
});
lb.addEventListener("click", (e) => { if (e.target === lb) close(); });
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") open(openAt - 1);
  if (e.key === "ArrowRight") {
    if (openAt === items.length - 1) load();
    open(openAt + 1);
  }
});

load();
</script>
</body>
</html>
