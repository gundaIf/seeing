<title>Seeing · ～への入り口 ✴︎ Deen David</title>
<meta name="description" content="Analog and digital photographs.">
<link rel="icon" href="https://cdn.blot.im/blog_e9e46454a86f4b50aded8710a3e59817/_avatars/c5a1db36-3051-4d3e-b5da-bb6bf31b219d.jpg" type="image/x-icon">
<script>
(function () {
  var root = document.documentElement;
  try {
    var t = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', t || (prefersDark ? 'dark' : 'light'));
  } catch (e) { root.setAttribute('data-theme', 'light'); }
})();
</script>
<style>
:root{--text:#2a2722;--text-rgb:42,39,34;--bg:#f5f1e9;--accent:#b0673a;--paper:#efe9dc;--film:#2a2722;--header-size:calc(15px * .6667);--breath:clamp(44px,8vw,112px);color-scheme:light}
[data-theme=dark]{--text:#d9d4ca;--text-rgb:217,212,202;--bg:#15161b;--accent:#d89a5c;--paper:#1c1d22;--film:#08090b;color-scheme:dark}
*{box-sizing:border-box}
html{font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.6;scroll-behavior:smooth}
body{margin:0;color:var(--text);background:var(--bg);min-height:100vh}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:22px 28px 0}
.site-title{margin:0;font-size:var(--header-size);font-weight:400;letter-spacing:.1em;text-transform:uppercase;line-height:1.7}
.site-header-actions{display:flex;align-items:center;gap:14px}
.home-btn{display:inline-flex;align-items:center;justify-content:center;width:1.75em;height:1.75em;padding:0;border:0;background:none;color:inherit;cursor:pointer}
.home-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}
.home-btn:hover{color:var(--accent)}
.theme-toggle{background:none;border:0;padding:0;cursor:pointer;color:inherit}
.theme-toggle-track{position:relative;display:inline-block;width:1.75em;height:.875em;border:1px solid rgba(var(--text-rgb),.35);border-radius:999px}
.theme-toggle-thumb{position:absolute;top:50%;left:.125em;width:.5em;height:.5em;border-radius:50%;background:rgba(var(--text-rgb),.5);transform:translateY(-50%);transition:left .2s ease}
[data-theme=dark] .theme-toggle-thumb{left:calc(100% - .5em - .125em);background:rgba(var(--text-rgb),.9)}
.theme-toggle:hover .theme-toggle-thumb{background:var(--accent)}
.intro{text-align:center;margin:3.2em auto 1.8em;padding:0 24px}
.intro h2{margin:0 0 .3em;font-size:18px;font-weight:400}
.intro p{margin:0;font-size:13px;color:rgba(var(--text-rgb),.55)}
.gear,.photos-head,.wall,footer{width:min(1180px,calc(100% - 48px));margin-left:auto;margin-right:auto}
.gear{margin-bottom:3.6em}
.gear-head{margin:0 0 1em}
.gear-head h3,.photos-head h3{margin:0;font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:rgba(var(--text-rgb),.5)}

/* Gear: a sketchbook page */
.kit{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding:40px 44px 28px;background-color:var(--paper);background-image:radial-gradient(rgba(var(--text-rgb),.14) .75px,transparent 1px);background-size:16px 16px;background-position:8px 8px}
.body{display:flex;flex-direction:column;align-items:center;text-align:center;flex:0 0 auto;margin:0}
.body svg{display:block;height:var(--h);width:auto;margin:0 0 14px;transform:rotate(var(--tilt));stroke:currentColor;fill:none;stroke-linejoin:round;stroke-linecap:round;transition:color .25s ease}
.body svg .ink{stroke-width:1.55}
.body svg .ghost{stroke-width:.9;opacity:.38}
.body svg .soft{stroke-width:.7;opacity:.5}
.body .name{font-size:12px;white-space:nowrap}
.body .meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--text-rgb),.45);white-space:nowrap}
.body:hover svg{color:var(--accent)}
.kit.pending path{stroke-dasharray:1;stroke-dashoffset:1}
.kit.drawing path{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1.1s cubic-bezier(.45,.05,.3,1);transition-delay:calc(var(--i) * .16s)}
.kit.drawing path.ghost,.kit.drawing path.soft{transition-duration:.8s;transition-delay:calc(var(--i) * .16s + .7s)}

/* Photographs head + view switch */
.photos-head{margin-bottom:1.4em;display:flex;align-items:baseline;justify-content:space-between;gap:1em}
.photos-side{display:flex;align-items:baseline;gap:18px}
.switch{display:flex;gap:12px}
.switch button{background:none;border:0;padding:0 0 2px;cursor:pointer;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--text-rgb),.4);border-bottom:1px solid transparent}
.switch button:hover{color:var(--accent)}
.switch button[aria-pressed=true]{color:var(--text);border-bottom-color:currentColor}
.count{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--text-rgb),.4)}
.wall{margin-bottom:1.2em}

/* Book: photographs sequenced like a photobook */
.spread{display:flex;gap:12px;margin:0 0 var(--breath)}
.spread.c{margin-left:auto;margin-right:auto}
.spread.r{margin-left:auto}
.spread.one{justify-content:center}
.spread.one.l{justify-content:flex-start}
.spread.one.r{justify-content:flex-end;margin-left:0}
.spread.pair{width:min(var(--pw),calc(78vh * var(--sum) + 12px))}
.spread.three{width:min(100%,calc(58vh * var(--sum) + 24px))}
.fig{margin:0;min-width:0;flex:var(--ar) 1 0}
.one .fig{flex:none;width:min(var(--w),calc(84vh * var(--ar)))}
.frame{display:block;width:100%;aspect-ratio:var(--ar);padding:0;border:0;background:rgba(var(--text-rgb),.05);overflow:hidden;cursor:zoom-in}
.frame img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.frame img.on{opacity:1}
.fig figcaption{margin-top:.7em;font-size:11px;line-height:1.4;color:rgba(var(--text-rgb),.55)}

/* Sheet: a contact sheet, frames on film strips */
.wall.sheet{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));row-gap:20px}
.neg{position:relative;display:block;padding:15px 3px 24px;border:0;background:var(--film);cursor:zoom-in}
.neg::before,.neg::after{content:"";position:absolute;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,transparent 0 5px,var(--bg) 5px 10px);opacity:.9}
.neg::before{top:5px}.neg::after{bottom:5px}
.neg .shot{display:block;aspect-ratio:3/2;overflow:hidden;background:rgba(255,255,255,.04)}
.neg img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease}
.neg img.on{opacity:1}
.neg .n{position:absolute;left:6px;bottom:10px;font-size:8.5px;line-height:1;letter-spacing:.08em;color:var(--accent)}
.neg:hover .shot{outline:2px solid var(--accent);outline-offset:-2px}

.status{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--text-rgb),.45);min-height:1.4em;margin:0 0 2em}
footer{padding:0 0 36px;display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--text-rgb),.4)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:none;align-items:center;justify-content:center;padding:2em}
.lb.on{display:flex}
.lb img{max-width:min(94vw,1500px);max-height:88vh;object-fit:contain}
.lb-meta{position:absolute;left:2em;right:2em;bottom:1.4em;display:flex;justify-content:space-between;gap:1em;color:#f2f2f2;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lb-meta a:hover{color:var(--accent)}
.lb-x,.lb-prev,.lb-next{position:absolute;background:none;border:0;color:#f2f2f2;cursor:pointer;font-size:28px;padding:8px}
.lb-x{top:1em;right:1.2em}.lb-prev{left:.4em;top:50%;transform:translateY(-50%)}.lb-next{right:.4em;top:50%;transform:translateY(-50%)}
@media (max-width:1080px){.kit{overflow-x:auto;justify-content:flex-start;gap:44px;scroll-snap-type:x mandatory}.body{scroll-snap-align:center}.wall.sheet{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:720px){.site-header{padding:18px 16px 0}.gear,.wall,footer,.photos-head{width:calc(100% - 24px)}.kit{padding:30px 26px 22px}.spread{gap:6px}.one .fig{width:min(max(var(--w),88%),calc(84vh * var(--ar)))}.spread.pair{width:100%}.wall.sheet{grid-template-columns:repeat(3,minmax(0,1fr))}.photos-head{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){.frame img,.neg img,.body svg{transition:none}}
</style>
</head>

}
function renderBook(){
  while(placed<items.length){
    let kind=nextKind();const need={hero:1,solo:1,pair:2,three:3}[kind];const left=items.length-placed;
    if(left<need){if(!done)return;kind=left===2?"pair":"solo"}
    const group=items.slice(placed,placed+({hero:1,solo:1,pair:2,three:3}[kind]));
    const s=document.createElement("div");s.className="spread";
    if(kind==="hero"||kind==="solo"){
      const e=group[0];const land=e.w/e.h>=1;s.classList.add("one");
      if(kind==="hero"){s.style.setProperty("--w",land?"100%":"50%");book.lastHero=book.n}
      else{s.classList.add(book.side++%2?"r":"l");s.style.setProperty("--w",land?"58%":"38%")}
    }else{
      const sum=group.reduce((a,e)=>a+e.w/e.h,0);s.style.setProperty("--sum",sum.toFixed(3));
      s.classList.add(kind==="pair"?"pair":"three");
      if(kind==="pair"){const a=["c","l","r"][book.align++%3];s.classList.add(a);s.style.setProperty("--pw",a==="c"?"100%":"84%")}
    }
    group.forEach(e=>s.appendChild(figure(e,kind!=="three")));
    wall.appendChild(s);placed+=group.length;book.prev=kind;book.n++;
  }
}
// Sheet view: a contact sheet, numbered in the order the frames were added.
function renderSheet(){
  for(;placed<items.length;placed++){
    const e=items[placed];const b=document.createElement("button");b.type="button";b.className="neg";b.setAttribute("aria-label",(e.title||"Photograph")+", frame "+(e.i+1));
    const shot=document.createElement("span");shot.className="shot";shot.appendChild(picture(e.thumb,e.title));b.appendChild(shot);
    const n=document.createElement("span");n.className="n";n.textContent=(e.i+1)+"  ▸ "+(e.i+1)+"A";b.appendChild(n);
    b.addEventListener("click",()=>open(e.i));wall.appendChild(b);
  }
}
function fill(){if(!done&&document.body.offsetHeight<window.innerHeight+1200)setTimeout(load,0)}
function render(){view==="book"?renderBook():renderSheet()}
function setView(v){
  if(v===view)return;view=v;try{localStorage.setItem("seeing-view",v)}catch(e){}
  wall.innerHTML="";wall.className="wall "+v;placed=0;Object.assign(book,{n:0,prev:"",lastHero:0,side:0,align:0});
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===v)));
  render();fill();
}
document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
if(view==="sheet"){view="book";setView("sheet")}

function addBlock(block){if(block.type!=="Image"||!block.image)return;const i=items.length;const w=block.image.width||3,h=block.image.height||2;const portrait=(w/h)<0.95;items.push({i,id:block.id,thumb:srcOf(block,portrait?"medium":"large"),large:srcOf(block,"large"),title:prettyTitle(block.title),w,h,portrait})}
async function load(){if(loading||done)return;loading=true;statusEl.textContent=page===1?"Gathering photographs…":"More…";try{const res=await fetch("https://api.are.na/v3/channels/"+SLUG+"/contents?page="+page+"&per="+PER);if(!res.ok)throw new Error("Are.na "+res.status);const json=await res.json();const meta=json.meta||{};(json.data||[]).forEach(addBlock);total=meta.total_count||total;if(!meta.has_more_pages||!(json.data||[]).length)done=true;else page+=1;render();countEl.textContent=total?items.length+" of "+total:items.length+" photographs";statusEl.textContent=""}catch(err){statusEl.textContent="Could not reach Are.na. Try again in a moment.";console.error(err)}finally{loading=false;fill()}}
window.addEventListener("scroll",()=>{if(window.innerHeight+window.scrollY>=document.body.offsetHeight-1200)load()},{passive:true});

function open(i){if(i<0||i>=items.length)return;openAt=i;const it=items[i];lbi.src=it.large||it.thumb;lbi.alt=it.title||"";lbm.innerHTML="";if(it.title)lbm.append(it.title+" · ");const a=document.createElement("a");a.href="https://www.are.na/block/"+it.id;a.target="_blank";a.rel="noopener";a.textContent="on are.na";lbm.appendChild(a);lbc.textContent=(i+1)+" / "+(total||items.length);if(items[i+1])new Image().src=items[i+1].large;lb.hidden=false;lb.classList.add("on");document.body.style.overflow="hidden"}
function close(){lb.classList.remove("on");lb.hidden=true;lbi.src="";document.body.style.overflow="";openAt=-1}
function step(d){if(d>0&&openAt===items.length-1)load();open(openAt+d)}
document.getElementById("lbx").addEventListener("click",close);
document.getElementById("lbp").addEventListener("click",()=>step(-1));
document.getElementById("lbn").addEventListener("click",()=>step(1));
lb.addEventListener("click",e=>{if(e.target===lb)close()});
let tx=null;lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
load();
</script>
</body>
